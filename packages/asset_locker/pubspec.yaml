name: asset_locker
description: "Shared asset library for every app: one folder, typed and tagged assets, pick/save screens."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.westonuchiha.asset_locker
        pluginClass: AssetLockerPlugin
