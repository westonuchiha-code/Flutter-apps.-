name: Album

# Renders "Twelve-Bit Science" (tool/album) and publishes it as the
# album-latest pre-release: the instrumental tracks as MP3 (our own mp3_kit
# encoder) and WAV, and a 30-second "Liquid Logic" music video as MP4 (made
# in Puppet Stage on Windows, where video_encoder writes MP4).
on:
  push:
    paths:
      - "tool/album/**"
      - "packages/chip_synth/**"
      - "packages/mp3_kit/**"
      - "apps/puppet_stage/tool/liquid_logic.dart"
      - "apps/puppet_stage/integration_test/**"
      - "apps/puppet_stage/lib/**"
      - ".github/workflows/album.yml"
  workflow_dispatch:

concurrency:
  group: album-${{ github.ref }}
  cancel-in-progress: true

jobs:
  album:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - name: Render the album
        working-directory: tool/album
        run: |
          dart pub get
          dart run bin/make_album.dart out
          dart run bin/check.dart out
      - name: Keep the Liquid Logic WAV for the video
        uses: actions/upload-artifact@v4
        with:
          name: liquid-logic-wav
          path: tool/album/out/06 - Liquid Logic.wav
          retention-days: 3
      - name: Package
        working-directory: tool/album/out
        run: |
          mkdir -p "../pack/Twelve-Bit Science" "../pack/mp3/Twelve-Bit Science" ../songs
          for f in *.mp3; do cp "$f" ../songs/; mv "$f" "../pack/mp3/Twelve-Bit Science/"; done
          mv *.wav "../pack/Twelve-Bit Science/"
          cd ../pack
          zip -qr ../Twelve-Bit-Science-WAV.zip "Twelve-Bit Science"
          cd mp3
          zip -qr ../../Twelve-Bit-Science-MP3.zip "Twelve-Bit Science"
          ls -l ../.. ../../songs
      - name: Replace the album-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete album-latest --cleanup-tag --yes || true
          gh release create album-latest tool/album/Twelve-Bit-Science-MP3.zip \
            tool/album/songs/*.mp3 tool/album/Twelve-Bit-Science-WAV.zip \
            --target "$GITHUB_SHA" --prerelease \
            --title "Twelve-Bit Science - The Allophones (latest render)" \
            --notes "Rendered by tool/album from ${GITHUB_SHA::7}: 12 instrumental tracks as MP3 (320 kbps, one by one and zipped) and WAV, and a 30-second Liquid Logic music video (MP4, added by the next job)."

  music-video:
    # Puppet Stage renders the video inside the real app on Windows, where
    # video_encoder writes H.264 + AAC MP4 with Media Foundation.
    needs: album
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.1"
          channel: stable
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: liquid-logic-wav
          path: music
      - name: Render the video
        shell: bash
        working-directory: apps/puppet_stage
        run: |
          flutter pub get
          mkdir -p ../../video
          flutter test integration_test/liquid_logic_video_test.dart -d windows \
            "--dart-define=WAV=${{ github.workspace }}/music/06 - Liquid Logic.wav" \
            "--dart-define=OUT=${{ github.workspace }}/video" \
            --dart-define=FROM_BAR=34 --dart-define=TO_BAR=45
          ls -l ../../video
      - name: Add it to album-latest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload album-latest video/Liquid-Logic-34-45.mp4 --clobber
