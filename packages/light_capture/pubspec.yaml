name: light_capture
description: "Live webcam brightness frames on Windows (Media Foundation) and Linux (V4L2)."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      linux:
        pluginClass: LightCapturePlugin
      windows:
        pluginClass: LightCapturePluginCApi
