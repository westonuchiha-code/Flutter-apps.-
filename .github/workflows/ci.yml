name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep in sync with the Flutter version used for local development.
  FLUTTER_VERSION: "3.50.1"
  FLUTTER_CHANNEL: stable
  # What Flutter's Android builds download (cached between runs).
  ANDROID_NDK_VERSION: "28.2.13676358"
  ANDROID_CMAKE_VERSION: "3.22.1"

jobs:
  # Finds every Flutter app under apps/ so each one is checked and built.
  discover:
    name: Discover apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.find.outputs.apps }}
      has_apps: ${{ steps.find.outputs.has_apps }}
      android_apps: ${{ steps.find.outputs.android_apps }}
      windows_apps: ${{ steps.find.outputs.windows_apps }}
      linux_apps: ${{ steps.find.outputs.linux_apps }}
    steps:
      - uses: actions/checkout@v5
      - id: find
        # An app is built for a platform only if it has that platform's
        # folder (e.g. an Android-only app has no windows/ or linux/).
        run: |
          list() {
            for d in apps/*/; do
              [ -f "$d/pubspec.yaml" ] || continue
              [ -f "$d/.ci-skip" ] && continue  # work in progress
              if [ -z "$1" ] || [ -d "$d/$1" ]; then basename "$d"; fi
            done | sort | jq -R . | jq -sc .
          }
          apps=$(list "")
          echo "Found apps: $apps"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "android_apps=$(list android)" >> "$GITHUB_OUTPUT"
          echo "windows_apps=$(list windows)" >> "$GITHUB_OUTPUT"
          echo "linux_apps=$(list linux)" >> "$GITHUB_OUTPUT"
          if [ "$apps" = "[]" ]; then echo "has_apps=false" >> "$GITHUB_OUTPUT"; else echo "has_apps=true" >> "$GITHUB_OUTPUT"; fi
      # Every app has its own 16-bit icon, drawn with pixel_kit (Pixel Forge's
      # engine) by tool/icons/bin/make_icons.dart (CLAUDE.md).
      - name: Every app has its pixel icon
        run: |
          missing=""
          for d in apps/*/; do
            [ -f "$d/pubspec.yaml" ] || continue
            [ -f "$d/icon/icon.pixel_sprite.json" ] || missing="$missing $(basename "$d")"
          done
          if [ -n "$missing" ]; then
            echo "::error::No icon for:$missing. Draw it in tool/icons/bin/make_icons.dart and run: dart run tool/icons/bin/make_icons.dart"
            exit 1
          fi

  analyze-test:
    name: Analyze & test (${{ matrix.app }})
    needs: discover
    if: needs.discover.outputs.has_apps == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install ALSA headers (flutter test builds audio plugins' native code)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libmpv-dev
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  packages:
    name: Packages (analyze, test, native tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Install ALSA headers (flutter test builds audio plugins' native code)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Analyze and test every package in packages/
        run: |
          for dir in packages/*/; do
            [ -f "$dir/pubspec.yaml" ] || continue
            echo "::group::$dir"
            if grep -q "sdk: flutter" "$dir/pubspec.yaml"; then runner="flutter test"; else runner="dart test"; fi
            (cd "$dir" && flutter pub get && dart format --output=none --set-exit-if-changed lib test \
              && flutter analyze && { [ ! -d test ] || $runner; }) || exit 1
            echo "::endgroup::"
          done
      - name: Native unit tests
        run: |
          for t in packages/*/test_native/*_test.cc; do
            [ -f "$t" ] || continue
            pkg=$(dirname "$(dirname "$t")")
            c++ -std=c++17 -Wall -Wextra -Werror -I "$pkg/common" "$t" -o /tmp/native_test && /tmp/native_test
          done

  build-android:
    name: Android (${{ matrix.app }})
    needs: discover
    if: needs.discover.outputs.android_apps != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Fewer jobs downloading at once: Maven Central answers bursts with
      # "429 Too Many Requests".
      max-parallel: 8
      matrix:
        app: ${{ fromJson(needs.discover.outputs.android_apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - name: Use the shared signing key (updates install over old builds)
        run: mkdir -p ~/.android && cp "$GITHUB_WORKSPACE/.github/android/debug.keystore" ~/.android/debug.keystore
      # The NDK (~1 GB) and CMake used to be downloaded by every job, and a
      # corrupted download failed the build.
      - name: Cache Android NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/${{ env.ANDROID_NDK_VERSION }}
            /usr/local/lib/android/sdk/cmake/${{ env.ANDROID_CMAKE_VERSION }}
          key: android-ndk-${{ env.ANDROID_NDK_VERSION }}-cmake-${{ env.ANDROID_CMAKE_VERSION }}
      - run: flutter pub get
      - name: "Build APK (retried: downloads sometimes fail)"
        run: |
          for attempt in 1 2 3; do
            if flutter build apk --release; then exit 0; fi
            [ "$attempt" = 3 ] && break
            echo "::warning::Build attempt $attempt failed (often a download hiccup); retrying in $((attempt * 60)) s"
            sleep $((attempt * 60))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-android-apk
          path: apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  build-windows:
    name: Windows (${{ matrix.app }})
    needs: discover
    if: needs.discover.outputs.windows_apps != '[]'
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.windows_apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      # Run the tests on Windows too, to catch platform-specific behaviour
      # (paths, line endings, etc.).
      - run: flutter test
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-windows-x64
          path: apps/${{ matrix.app }}/build/windows/x64/runner/Release/
          if-no-files-found: error

  # Linux is a secondary target: it is built on every run, but a failure here
  # does not fail the workflow.
  build-linux:
    name: Linux (${{ matrix.app }}, best-effort)
    needs: discover
    if: needs.discover.outputs.linux_apps != '[]'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.linux_apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux desktop build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev libmpv-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-linux-x64
          path: apps/${{ matrix.app }}/build/linux/x64/release/bundle/
          if-no-files-found: error

  # Publishes the latest builds of each app as a GitHub pre-release
  # ("<app>-latest") so they can be downloaded and installed from a phone.
  publish:
    name: Publish latest builds (${{ matrix.app }})
    needs: [discover, analyze-test, packages, build-android, build-windows]
    if: >-
      always() && github.event_name != 'pull_request' &&
      needs.discover.outputs.has_apps == 'true' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.app }}-*
          path: dist
      - name: Package files
        run: |
          mkdir out
          if [ -d dist/${{ matrix.app }}-android-apk ]; then
            cp dist/${{ matrix.app }}-android-apk/app-release.apk "out/${{ matrix.app }}-android.apk"
          fi
          if [ -d dist/${{ matrix.app }}-windows-x64 ]; then
            (cd dist/${{ matrix.app }}-windows-x64 && zip -qr "$GITHUB_WORKSPACE/out/${{ matrix.app }}-windows-x64.zip" .)
          fi
          if [ -d dist/${{ matrix.app }}-linux-x64 ]; then
            tar -czf "out/${{ matrix.app }}-linux-x64.tar.gz" -C dist/${{ matrix.app }}-linux-x64 .
          fi
          ls -l out
      - name: Replace the <app>-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ matrix.app }}-latest
        run: |
          gh release delete "$TAG" --cleanup-tag --yes || true
          gh release create "$TAG" out/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "${{ matrix.app }} (latest build)" \
            --notes "Built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}.
          Android: download the .apk on your phone and open it to install.
          Windows (if included): unzip and run ${{ matrix.app }}.exe."

  # Every app in two labelled zips ("All-Apps-Android.zip" with
  # "<App Name>.apk", "All-Apps-Windows.zip" with a folder per app), as
  # the all-apps-latest pre-release.
  bundle:
    name: Bundle every app
    needs: [discover, publish]
    if: >-
      always() && github.event_name != 'pull_request' &&
      needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Make the zips
        run: |
          mkdir -p "out/android" "out/windows"
          {
            echo "Weston's apps, built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}."
            echo
            echo "Android: open the .apk on the phone to install (or update) it."
            echo "Windows: unzip, open the app's folder, run its .exe."
            echo
          } > out/README.txt
          for d in apps/*/; do
            app=$(basename "$d")
            label=$(grep -oP 'android:label="\K[^"]+' "$d/android/app/src/main/AndroidManifest.xml" 2>/dev/null | head -1)
            [ -n "$label" ] || label="$app"
            # plain letters in file names: zip mangles é ("Pok#U00e9ville")
            label=$(printf %s "$label" | LC_ALL=C.UTF-8 iconv -f UTF-8 -t ASCII//TRANSLIT 2>/dev/null) || label="$app"
            if [ -f "dist/$app-android-apk/app-release.apk" ]; then
              cp "dist/$app-android-apk/app-release.apk" "out/android/$label.apk"
              echo "$label ($app): Android" >> out/README.txt
            fi
            if [ -d "dist/$app-windows-x64" ]; then
              cp -r "dist/$app-windows-x64" "out/windows/$label"
              echo "$label ($app): Windows" >> out/README.txt
            fi
          done
          cp out/README.txt out/android/ && cp out/README.txt out/windows/
          (cd out/android && zip -qr "../All-Apps-Android.zip" .)
          (cd out/windows && zip -qr "../All-Apps-Windows.zip" .)
          ls -l out
      - name: Replace the all-apps-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete all-apps-latest --cleanup-tag --yes || true
          gh release create all-apps-latest "out/All-Apps-Android.zip" "out/All-Apps-Windows.zip" \
            --target "$GITHUB_SHA" --prerelease \
            --title "All apps (latest builds)" \
            --notes "Every app, labelled. Android: unzip, then open each .apk. Windows: unzip, open the app's folder, run its .exe."
