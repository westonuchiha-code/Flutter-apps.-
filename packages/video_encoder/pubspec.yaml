name: video_encoder
description: "Writes videos with sound: MP4 (H.264 + AAC) with the system encoders on Android (MediaCodec) and Windows (Media Foundation); pure-Dart MJPEG AVI everywhere."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  image: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.westonuchiha.video_encoder
        pluginClass: VideoEncoderPlugin
      windows:
        pluginClass: VideoEncoderPluginCApi
