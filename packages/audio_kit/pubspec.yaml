name: audio_kit
description: "Shared audio tools: mic recording to WAV, WAV reading/writing, waveform peaks and view, clip playback."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_recorder: 2.0.8 # pinned like flutter_soloud
  flutter_soloud: 5.3.2 # pinned: optical_theremin uses its experimental stream API
  material_ui: ^1.1.0
  path: ^1.9.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.westonuchiha.audio_kit
        pluginClass: AudioKitPlugin
