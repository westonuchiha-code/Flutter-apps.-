name: pokeville
description: "Pokéville, the PC XMB Frontend's Pokémon Box, on Android/Windows/Linux: view and arrange the Box (box.json synced through Cross-Save) and move Pokémon in and out of the Gen 1-3 game saves."
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.14.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  app_shell:
    path: ../app_shell
  path: any
  poke_saves:
    path: ../poke_saves
  save_kit:
    path: ../save_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: any

flutter:
  assets:
    - assets/poke-ball.png
    - assets/fonts/OFL-PixelifySans.txt
    - assets/fonts/OFL-DotGothic16.txt
  # Both SIL OFL 1.1 (licence texts beside them in assets/fonts).
  fonts:
    - family: PixelifySans
      fonts:
        - asset: assets/fonts/PixelifySans.ttf
    - family: DotGothic16
      fonts:
        - asset: assets/fonts/DotGothic16-Regular.ttf
